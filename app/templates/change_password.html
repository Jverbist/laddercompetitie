{% extends "base.html" %}{% block body %}<main class="auth"><section class="card"><img class="logo auth-logo" src="/static/exn-logo-white.svg" alt="Exclusive Networks"><p class="eyebrow">Eerste aanmelding</p><h1>Nieuw wachtwoord</h1><p class="muted">Hallo {{user.name}}, kies minstens 12 tekens.</p>{% if error %}<p class="notice error">{{error}}</p>{% endif %}<form class="auth-form" method="post"><label>Huidig wachtwoord<input type="password" name="current_password" required></label><label>Nieuw wachtwoord<input type="password" name="new_password" minlength="12" required></label><label>Bevestig nieuw wachtwoord<input type="password" name="confirm_password" minlength="12" required></label><button class="button">Bewaren</button></form></section></main>{% endblock %}
