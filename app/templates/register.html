{% extends "base.html" %}{% block title %}Registreren{% endblock %}{% block body %}<main class="auth"><section class="card"><p class="eyebrow">Kantoorcompetitie 2026</p><h1>Registreer je.</h1><p class="muted">Je start onderaan de ladder.</p>{% if error %}<p class="notice error">{{error}}</p>{% endif %}<form class="auth-form" method="post" action="/register"><label>Naam<input type="text" name="name" maxlength="100" required></label><label>E-mail<input type="email" name="email" required></label><label>Wachtwoord (min. 12 tekens)<input type="password" name="password" minlength="12" maxlength="128" required></label><label>Bevestig wachtwoord<input type="password" name="confirm_password" minlength="12" maxlength="128" required></label><button class="button">Registreren</button></form><p class="muted">Al een account? <a href="/login">Aanmelden</a></p></section></main>{% endblock %}
